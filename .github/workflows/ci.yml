name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore cordis-csharp.slnx

      - name: Build (warnings as errors)
        run: dotnet build cordis-csharp.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test cordis-csharp.slnx --no-build --no-restore

      - name: Style verification (dotnet format)
        run: dotnet format cordis-csharp.slnx --no-restore --verify-no-changes

      - name: Documentation frontmatter validation
        run: |
          python3 -c "print('frontmatter validation runs in central-governance repo (R10)')"
